name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go（build / vet / test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      # 需要真实数据库的用例会自己 t.Skip（PG_INTEGRATION_TEST 未设置时跳过），
      # 所以这里不需要起 PostgreSQL / Chroma。
      - run: go test ./...

  web:
    name: 前端（typecheck / build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vue-tsc -b
      - run: pnpm run build
